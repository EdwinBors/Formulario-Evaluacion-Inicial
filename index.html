<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Formulario inicial · Asesoría EB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D0D;
    --card:#1A1A1A;
    --card-2:#151515;
    --border:#2A2A2A;
    --lime:#D4FF3D;
    --lime-dim:#3A3A00;
    --white:#FFFFFF;
    --gray:#A6A6A6;
    --gray-dim:#6E6E6E;
    --danger:#FF6B6B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  h1,h2,h3{
    font-family:'Playfair Display',Georgia,serif;
    font-weight:800;
    margin:0;
    line-height:1.15;
  }
  /* ---------- Progress ---------- */
  .progress-wrap{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--bg);
    padding:14px 20px 10px 20px;
    border-bottom:1px solid var(--border);
  }
  .progress-track{
    height:5px;
    border-radius:3px;
    background:var(--card);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--lime);
    border-radius:3px;
    transition:width .35s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gray);
    font-weight:600;
  }
  .progress-label span.step-name{
    color:var(--lime);
  }
  /* ---------- Content ---------- */
  .content{
    flex:1;
    padding:28px 20px 140px 20px;
  }
  .eyebrow{
    color:var(--lime);
    font-size:12px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .section-title{
    font-size:26px;
    margin-bottom:8px;
  }
  .section-desc{
    color:var(--gray);
    font-size:14.5px;
    line-height:1.5;
    margin-bottom:26px;
  }
  .field{
    margin-bottom:26px;
  }
  .field-label{
    font-size:15px;
    font-weight:600;
    margin-bottom:10px;
    line-height:1.4;
    display:block;
  }
  .field-hint{
    color:var(--gray-dim);
    font-size:12.5px;
    margin-top:6px;
    line-height:1.4;
  }
  .required-mark{ color:var(--lime); margin-left:3px; }

  input[type="text"],
  input[type="number"],
  input[type="tel"],
  textarea,
  select{
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--white);
    font-family:'Inter',sans-serif;
    font-size:16px;
    border-radius:12px;
    padding:13px 14px;
    outline:none;
    transition:border-color .15s ease;
  }
  input:focus, textarea:focus, select:focus{
    border-color:var(--lime);
  }
  textarea{
    min-height:90px;
    resize:vertical;
    line-height:1.5;
  }
  .input-with-unit{
    position:relative;
  }
  .input-with-unit input{
    padding-right:52px;
  }
  .unit-label{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--gray-dim);
    font-size:13.5px;
    pointer-events:none;
  }

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--white);
    font-size:14px;
    font-weight:500;
    padding:11px 16px;
    border-radius:999px;
    cursor:pointer;
    user-select:none;
    transition:all .12s ease;
    line-height:1.3;
  }
  .chip:active{ transform:scale(.97); }
  .chip.selected{
    background:var(--lime);
    border-color:var(--lime);
    color:#0D0D0D;
    font-weight:700;
  }
  .chip.full-width{
    width:100%;
    text-align:center;
  }

  .scale-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .scale-btn{
    width:44px;
    height:44px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--white);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .scale-btn.selected{
    background:var(--lime);
    border-color:var(--lime);
    color:#0D0D0D;
  }
  .scale-caption{
    display:flex;
    justify-content:space-between;
    font-size:11.5px;
    color:var(--gray-dim);
    margin-top:6px;
  }

  .followup{
    margin-top:12px;
    padding-left:2px;
    border-left:2px solid var(--lime-dim);
    padding-left:14px;
  }

  /* ---------- Nav buttons ---------- */
  .nav-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    padding:22px 0 18px 0;
    pointer-events:none;
  }
  .nav-inner{
    width:100%;
    max-width:480px;
    display:flex;
    gap:10px;
    padding:0 20px;
    pointer-events:auto;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:14px;
    padding:16px 18px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn-primary{
    background:var(--lime);
    color:#0D0D0D;
  }
  .btn-primary:active{ transform:scale(.98); }
  .btn-secondary{
    background:var(--card);
    color:var(--white);
    border:1px solid var(--border);
    flex:0 0 84px;
  }
  .btn:disabled{
    opacity:.4;
    cursor:not-allowed;
  }

  /* ---------- Intro / outro ---------- */
  .cover{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:40px 26px;
  }
  .cover .eyebrow{ text-align:center; }
  .cover h1{
    font-size:34px;
    text-align:center;
    margin-bottom:16px;
  }
  .cover h1 .accent{ color:var(--lime); }
  .cover p.lede{
    text-align:center;
    color:var(--gray);
    font-size:15.5px;
    line-height:1.6;
    margin-bottom:30px;
  }
  .info-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 20px;
    margin-bottom:14px;
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .info-card .icon{
    font-size:20px;
    line-height:1;
    margin-top:1px;
  }
  .info-card .txt{ font-size:14px; color:var(--gray); line-height:1.5; }
  .info-card .txt b{ color:var(--white); }

  .summary-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    font-size:13px;
    line-height:1.7;
    color:var(--gray);
    white-space:pre-wrap;
    max-height:340px;
    overflow-y:auto;
    font-family:'SF Mono',Consolas,monospace;
  }
  .summary-box b{ color:var(--white); }

  .toast{
    position:fixed;
    bottom:100px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--lime);
    color:#0D0D0D;
    font-weight:700;
    font-size:14px;
    padding:12px 20px;
    border-radius:999px;
    opacity:0;
    transition:all .25s ease;
    pointer-events:none;
    z-index:50;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  a.link-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-decoration:none;
    width:100%;
  }

  .womansection-badge{
    display:inline-block;
    background:var(--lime-dim);
    color:var(--lime);
    font-size:11px;
    font-weight:700;
    letter-spacing:.05em;
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:14px;
  }

  /* ---------- Photos ---------- */
  .photo-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .photo-thumb{
    position:relative;
    width:84px;
    height:84px;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .photo-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .photo-remove{
    position:absolute;
    top:4px;
    right:4px;
    width:22px;
    height:22px;
    border-radius:50%;
    border:none;
    background:rgba(0,0,0,.65);
    color:#fff;
    font-size:12px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .photo-add{
    width:84px;
    height:84px;
    border-radius:12px;
    border:1px dashed var(--border);
    background:var(--card);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    cursor:pointer;
  }
  .photo-add-icon{
    font-size:20px;
    color:var(--lime);
    line-height:1;
  }
  .photo-add-text{
    font-size:9.5px;
    color:var(--gray-dim);
    text-align:center;
    line-height:1.2;
    padding:0 4px;
  }
  .share-photos-note{
    font-size:12.5px;
    color:var(--gray-dim);
    line-height:1.5;
    margin-top:10px;
  }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }

  @media print{
    #resultsActions{ display:none; }
    body{ background:#fff; color:#000; }
    .content h3{ color:#000 !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

/* =========================================================
   FIELD SCHEMA
   ========================================================= */

      { key:'experiencia_gym', label:'Experiencia en gimnasios: tiempo y ejercicios que te gustan', type:'textarea' },

      { key:'nivel_estres', label:'¿Cómo valorarías tu nivel de estrés?', type:'scale', min:1, max:10, capLow:'Muy bajo', capHigh:'Muy alto' },

      { key:'horario_laboral', label:'¿Qué horario laboral tienes?', type:'text' },

  },
  {
    id: 'alimentacion',
    eyebrow: 'Para diseñar tu plan de nutrición',
    title: 'Alimentación',
    desc: '',
    fields: [
      { key:'dieta_anterior', label:'¿Has seguido alguna dieta anteriormente?', type:'yesno',

      { key:'dieta_resultado', label:'¿Cómo te fue con ella? ¿Llegaste al objetivo?', type:'textarea', showIf:(d)=>d.dieta_anterior==='Sí' },

      { key:'alergias_alimentarias', label:'Alergias o intolerancias alimentarias', type:'textarea' },
      { key:'platos_favoritos', label:'¿Cuáles son tus platos favoritos?', type:'textarea' },
      { key:'alimentos_favoritos', label:'¿Cuáles son tus alimentos favoritos?', type:'textarea' },

      { key:'dia_alimentacion', label:'¿Cómo es un día normal de alimentación? (desayuno, comida, merienda, cena, picoteos y bebidas)', type:'textarea' },
      { key:'agua_dia', label:'¿Cuánta agua bebes aproximadamente al día?', type:'radio',
        options:['Menos de 1L','1-2L','2-3L','Más de 3L'] },
      { key:'alcohol', label:'¿Bebes alcohol?', type:'radio',
        options:['Nunca','Ocasional (eventos)','1-2 veces por semana','Frecuente'] },
    ]
  },
  {
    id: 'motivacion',
    eyebrow: 'Última parte',
    title: 'Motivación y adherencia',
    desc: '',
    fields: [
      { key:'motivacion', label:'¿Qué te motiva a entrenar o empezar este plan?', type:'textarea' },
      { key:'forma_vida', label:'¿Quieres que sea una forma de vida o solo durante un tiempo?', type:'radio',
        options:['Quiero que sea un estilo de vida','Es algo puntual / temporal','Aún no lo sé'] },
      { key:'dificultades', label:'¿Qué crees que puede dificultar que cumplas el plan?', type:'textarea' },
      { key:'expectativas', label:'¿Qué esperas de este programa?', type:'textarea' },
      { key:'info_extra', label:'¿Hay alguna información que creas relevante y no hayamos comentado antes de empezar?', type:'textarea' },
    ]
  },
];

/* =========================================================
   STATE
   ========================================================= */
// step -1 = cover, 0..N-1 = sections, N = outro
let currentStep = -1;
const data = {};
let photoFiles = []; // { file, previewUrl }

function visibleSections(){
  return SECTIONS.filter(s => !s.showIf || s.showIf(data));
}
function visibleFields(section){
  return section.fields.filter(f => !f.showIf || f.showIf(data));
}

/* =========================================================
   RENDER HELPERS
   ========================================================= */
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function fieldHTML(f){
  const val = data[f.key];
  let inner = '';

  if(f.type === 'text' || f.type === 'number' || f.type === 'tel'){
    const unit = f.unit ? `<span class="unit-label">${f.unit}</span>` : '';
    inner = `<div class="input-with-unit">
      <input type="${f.type==='number'?'number':'text'}" data-key="${f.key}" value="${val?String(val).replace(/"/g,'&quot;'):''}" placeholder="Escribe aquí" inputmode="${f.type==='number'?'decimal':'text'}">
      ${unit}
    </div>`;
  } else if(f.type === 'textarea'){
    inner = `<textarea data-key="${f.key}" placeholder="Escribe aquí">${val?String(val):''}</textarea>`;
  } else if(f.type === 'radio'){
    inner = `<div class="chip-row" data-key="${f.key}" data-type="radio">` +
      f.options.map(o => `<div class="chip${val===o?' selected':''}" data-value="${o.replace(/"/g,'&quot;')}">${o}</div>`).join('') +
      `</div>`;
  } else if(f.type === 'yesno'){
    const opts = ['Sí','No'];
    inner = `<div class="chip-row" data-key="${f.key}" data-type="radio">` +
      opts.map(o => `<div class="chip${val===o?' selected':''}" data-value="${o}">${o}</div>`).join('') +
      `</div>`;
  } else if(f.type === 'multiselect'){
    const arr = Array.isArray(val) ? val : [];
    inner = `<div class="chip-row" data-key="${f.key}" data-type="multi">` +
      f.options.map(o => `<div class="chip${arr.includes(o)?' selected':''}" data-value="${o.replace(/"/g,'&quot;')}">${o}</div>`).join('') +
      `</div>`;
  } else if(f.type === 'scale'){
    const nums = [];
    for(let i=f.min;i<=f.max;i++) nums.push(i);
    inner = `<div class="scale-row" data-key="${f.key}" data-type="scale">` +
      nums.map(n => `<div class="scale-btn${val===n?' selected':''}" data-value="${n}">${n}</div>`).join('') +
      `</div>
      <div class="scale-caption"><span>${f.capLow||''}</span><span>${f.capHigh||''}</span></div>`;
  } else if(f.type === 'photos'){
    const thumbs = photoFiles.map((p, i) => `
      <div class="photo-thumb">
        <img src="${p.previewUrl}" alt="Foto ${i+1}">
        <button type="button" class="photo-remove" data-index="${i}">✕</button>
      </div>`).join('');
    inner = `
      <div class="photo-grid">
        ${thumbs}
        <label class="photo-add">
          <input type="file" accept="image/*" multiple id="photoInput" style="display:none">
          <span class="photo-add-icon">＋</span>
          <span class="photo-add-text">Añadir foto</span>
        </label>
      </div>`;
  }

  let followUpHTML = '';
  if(f.followUp && f.followUp.showWhen.includes(val)){
    const fu = f.followUp;
    const fuVal = data[fu.key];
    let fuInner = '';
    if(fu.type === 'textarea'){
      fuInner = `<textarea data-key="${fu.key}" placeholder="Escribe aquí">${fuVal?String(fuVal):''}</textarea>`;
    } else {
      const unit = fu.unit ? `<span class="unit-label">${fu.unit}</span>` : '';
      fuInner = `<div class="input-with-unit"><input type="${fu.type==='number'?'number':'text'}" data-key="${fu.key}" value="${fuVal?String(fuVal).replace(/"/g,'&quot;'):''}" placeholder="Escribe aquí">${unit}</div>`;
    }
    followUpHTML = `<div class="followup"><label class="field-label">${fu.label}</label>${fuInner}</div>`;
  }

  const hint = f.hint ? `<div class="field-hint">${f.hint}</div>` : '';

  return `<div class="field" data-field="${f.key}">
    <label class="field-label">${f.label}${f.required?'<span class="required-mark">*</span>':''}</label>
    ${inner}
    ${hint}
    ${followUpHTML}
  </div>`;
}

function summaryText(){
  let lines = [];
  lines.push('FORMULARIO INICIAL — ' + (data.nombre || 'Sin nombre'));
  lines.push('Contacto: ' + (data.contacto || '—'));
  lines.push('');
  visibleSections().forEach(s => {
    lines.push('— ' + s.title.toUpperCase() + ' —');
    visibleFields(s).forEach(f => {
      if(f.key==='nombre' || f.key==='contacto') return;
      if(f.type === 'photos'){
        lines.push(f.label + ': ' + (photoFiles.length ? photoFiles.length + ' foto(s) adjuntada(s) — se comparten aparte' : '(sin fotos)'));
        return;
      }
      let v = data[f.key];
      if(Array.isArray(v)) v = v.join(', ');
      if(v === undefined || v === null || v === '') v = '(sin responder)';
      lines.push(f.label + ': ' + v);
      if(f.followUp && f.followUp.showWhen.includes(data[f.key])){
        let fv = data[f.followUp.key];
        if(!fv) fv = '(sin responder)';
        lines.push('  ↳ ' + f.followUp.label + ': ' + fv);
      }
    });
    lines.push('');
  });
  return lines.join('\n');
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  if(currentStep === -1){
    app.appendChild(renderCover());
    const btnStart = document.getElementById('btnStart');
    if(btnStart) btnStart.addEventListener('click', () => { currentStep = 0; render(); });
    return;
  }

  const sections = visibleSections();

  if(currentStep >= sections.length){
    app.appendChild(renderOutro());
    attachOutroHandlers();
    return;
  }

  const section = sections[currentStep];

  const wrap = el(`<div></div>`);

  // progress
  const pct = Math.round(((currentStep) / sections.length) * 100);
  const progress = el(`
    <div class="progress-wrap">
      <div class="progress-label"><span>Paso ${currentStep+1} de ${sections.length}</span><span class="step-name">${section.title}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
  `);
  wrap.appendChild(progress);

  const content = el(`<div class="content"></div>`);
  const heading = el(`
    <div>
      <div class="eyebrow">${section.eyebrow}</div>
      <h2 class="section-title">${section.title}</h2>
      ${section.desc ? `<p class="section-desc">${section.desc}</p>` : '<div style="height:6px"></div>'}
      ${section.id==='mujer' ? '<div class="womansection-badge">Esta sección es opcional y confidencial</div>' : ''}
    </div>
  `);
  content.appendChild(heading);

  visibleFields(section).forEach(f => {
    content.appendChild(el(fieldHTML(f)));
  });

  wrap.appendChild(content);

  // nav
  const isFirst = currentStep === 0;
  const nav = el(`
    <div class="nav-bar">
      <div class="nav-inner">
        ${isFirst ? '' : '<button class="btn btn-secondary" id="btnBack">Atrás</button>'}
        <button class="btn btn-primary" id="btnNext">${currentStep === sections.length-1 ? 'Revisar y enviar' : 'Siguiente'}</button>
      </div>
    </div>
  `);
  wrap.appendChild(nav);

  app.appendChild(wrap);
  window.scrollTo(0,0);

  attachHandlers(section);
}

function attachHandlers(section){
  // text/number/textarea inputs
  document.querySelectorAll('input[data-key], textarea[data-key]').forEach(elm => {
    elm.addEventListener('input', (e) => {
      data[elm.dataset.key] = e.target.value;
    });
  });

  // photo picker
  const photoInput = document.getElementById('photoInput');
  if(photoInput){
    photoInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      files.forEach(file => {
        photoFiles.push({ file, previewUrl: URL.createObjectURL(file) });
      });
      render();
    });
  }
  document.querySelectorAll('.photo-remove').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const idx = parseInt(btn.dataset.index, 10);
      URL.revokeObjectURL(photoFiles[idx].previewUrl);
      photoFiles.splice(idx, 1);
      render();
    });
  });

  // radio / yesno chip rows
  document.querySelectorAll('.chip-row[data-type="radio"]').forEach(row => {
    row.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if(!chip) return;
      const key = row.dataset.key;
      data[key] = chip.dataset.value;
      render();
    });
  });

  // multiselect chip rows
  document.querySelectorAll('.chip-row[data-type="multi"]').forEach(row => {
    row.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if(!chip) return;
      const key = row.dataset.key;
      const val = chip.dataset.value;
      let arr = Array.isArray(data[key]) ? data[key].slice() : [];
      if(arr.includes(val)){
        arr = arr.filter(v => v !== val);
      } else {
        arr.push(val);
      }
      data[key] = arr;
      render();
    });
  });

  // scale rows
  document.querySelectorAll('.scale-row').forEach(row => {
    row.addEventListener('click', (e) => {
      const btn = e.target.closest('.scale-btn');
      if(!btn) return;
      const key = row.dataset.key;
      data[key] = parseInt(btn.dataset.value, 10);
      render();
    });
  });

  document.querySelectorAll('.chip, .scale-btn').forEach(elm => {
    elm.setAttribute('tabindex', '0');
    elm.setAttribute('role', 'button');
    elm.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        elm.click();
      }
    });
  });

  const back = document.getElementById('btnBack');
  if(back) back.addEventListener('click', () => { currentStep--; render(); });

  const next = document.getElementById('btnNext');
  if(next) next.addEventListener('click', () => {
    // simple required check
    const missing = visibleFields(section).filter(f => f.required && !data[f.key]);
    if(missing.length){
      alert('Por favor, completa: ' + missing.map(f=>f.label).join(', '));
      return;
    }
    currentStep++;
    render();
  });
}

  return el(`

      <div class="eyebrow">Asesoría EB</div>
      <h1>Formulario <span class="accent">inicial</span></h1>
      <p class="lede">Antes de diseñar tu plan de entrenamiento y nutrición, necesito conocerte bien. Tardarás unos 8-10 minutos — casi todo son preguntas para marcar, no para escribir.</p>

function renderOutro(){
  const text = summaryText();
  const hasPhotos = photoFiles.length > 0;
  const photosBlock = hasPhotos ? `
      <div class="field" style="margin-bottom:18px;">
        <label class="field-label">Tus fotos (${photoFiles.length})</label>
        <div class="photo-grid">
          ${photoFiles.map(p => `<div class="photo-thumb"><img src="${p.previewUrl}"></div>`).join('')}
        </div>

      </div>` : '';

  const wrap = el(`
    <div class="cover" style="justify-content:flex-start;padding-top:56px;">
      <div class="eyebrow">¡Ya casi está!</div>
      <h1 style="font-size:28px;">Revisa y envíame<br><span class="accent">tus respuestas</span></h1>
      <p class="lede" style="margin-bottom:18px;">Elige la forma más cómoda para hacérmelas llegar. No se envía nada automáticamente.</p>
      ${photosBlock}
      <div class="nav-inner" style="padding:0;flex-direction:column;gap:10px;margin-bottom:8px;">
        <button class="btn btn-primary" id="btnCopyLink">🔗 Copiar enlace con tus respuestas</button>
        <a class="btn btn-secondary link-btn" id="btnWhatsappLink" href="#" style="flex:1;">💬 Enviar enlace por WhatsApp</a>
      </div>
      <div class="field-hint" style="margin-bottom:20px;">El enlace abre tus respuestas ya rellenas, con el mismo diseño del formulario — nadie más puede verlas si no tiene el enlace.</div>
      <div class="nav-inner" style="padding:0;flex-direction:column;gap:10px;margin-bottom:20px;">
        <button class="btn btn-secondary" id="btnCopy">📋 Copiar como texto</button>
        <a class="btn btn-secondary link-btn" id="btnEmail" href="#" style="flex:1;">✉️ Enviar por email</a>
      </div>
      <div class="summary-box" id="summaryBox"></div>
      <div style="height:16px"></div>
      <button class="btn btn-secondary" id="btnEdit" style="width:100%;">Volver atrás y corregir algo</button>
    </div>
    <div class="toast" id="toast">Copiado al portapapeles</div>

  return wrap;
}

    navigator.clipboard.writeText(text).then(() => {
      const t = document.getElementById('toast');
      t.classList.add('show');

    }).catch(() => {

  document.getElementById('btnEmail').href =

      sharePhotosBtn.textContent = '📷 Compartir fotos (no disponible en este navegador)';

          });

    currentStep = visibleSections().length - 1;
    render();
  });
}

/* =========================================================
   RESULTS VIEW (read-only, reached via a shareable link)
   ========================================================= */
function buildResultsLink(){
  const payload = Object.assign({}, data, { _fecha: new Date().toLocaleString('es-ES') });
  const encoded = encodeURIComponent(JSON.stringify(payload));
  return location.origin + location.pathname + '#r=' + encoded;
}

function renderResultsView(resultData){
  const app = document.getElementById('app');
  app.innerHTML = '';

  const wrap = el(`<div></div>`);

  const header = el(`
    <div class="content" style="padding-top:32px;">
      <div class="eyebrow">Asesoría EB</div>
      <h1 style="font-size:26px;margin-bottom:4px;">Respuestas de<br><span class="accent">${resultData.nombre || 'cliente'}</span></h1>
      <p class="section-desc" style="margin-bottom:22px;">
        Contacto: ${resultData.contacto || '—'}${resultData._fecha ? ' · Enviado el ' + resultData._fecha : ''}
      </p>
      <div class="nav-inner" style="padding:0;gap:8px;margin-bottom:28px;" id="resultsActions">
        <button class="btn btn-primary" id="btnPrint">🖨️ Guardar como PDF</button>
      </div>
    </div>
  `);
  wrap.appendChild(header);

  const content = el(`<div class="content" style="padding-top:0;"></div>`);

  SECTIONS.filter(s => !s.showIf || s.showIf(resultData)).forEach(s => {
    const secBlock = el(`<div style="margin-bottom:30px;"></div>`);
    secBlock.appendChild(el(`<h3 style="font-size:18px;color:var(--lime);margin-bottom:14px;font-family:'Inter',sans-serif;font-weight:700;">${s.title}</h3>`));

    s.fields.filter(f => !f.showIf || f.showIf(resultData)).forEach(f => {
      if(f.type === 'photos') return; // las fotos se comparten aparte
      let v = resultData[f.key];
      if(Array.isArray(v)) v = v.join(', ');
      if(v === undefined || v === null || v === '') v = '—';
      const row = el(`
        <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);">
          <div style="font-size:12.5px;color:var(--gray-dim);margin-bottom:3px;">${f.label}</div>
          <div style="font-size:15px;color:var(--white);font-weight:500;line-height:1.4;">${v}</div>
        </div>
      `);
      secBlock.appendChild(row);
      if(f.followUp && f.followUp.showWhen.includes(resultData[f.key]) && resultData[f.followUp.key]){
        secBlock.appendChild(el(`
          <div style="margin:-8px 0 14px 14px;padding-bottom:14px;border-bottom:1px solid var(--border);">
            <div style="font-size:12px;color:var(--gray-dim);margin-bottom:3px;">↳ ${f.followUp.label}</div>
            <div style="font-size:14px;color:var(--gray);">${resultData[f.followUp.key]}</div>
          </div>
        `));
      }
    });
    content.appendChild(secBlock);
  });

  const footer = el(`<div style="text-align:center;padding:20px 0 50px 0;"><a href="${location.origin + location.pathname}" style="color:var(--gray-dim);font-size:13px;">Ir al formulario en blanco →</a></div>`);
  content.appendChild(footer);

  wrap.appendChild(content);
  app.appendChild(wrap);

  document.getElementById('btnPrint').addEventListener('click', () => window.print());
}

function getResultsFromHash(){
  const h = location.hash;
  if(h && h.indexOf('#r=') === 0){
    try{
      return JSON.parse(decodeURIComponent(h.slice(3)));
    }catch(e){ return null; }
  }
  return null;
}

const incomingResults = getResultsFromHash();
if(incomingResults){
  renderResultsView(incomingResults);
} else {
  render();
}
})();
